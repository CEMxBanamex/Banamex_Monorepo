# CI del monorepo. Corre en cada PR hacia dev o main y en cada push a dev.
#
# El único check obligatorio en las reglas del repo es `ci-ok`: junta el resultado de los demás, así los jobs que
# se saltan porque su carpeta no cambió no bloquean el PR.
#
# Seguridad: este workflow usa solo runners de GitHub. Los runners self-hosted nunca se usan en pull_request.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filtro.outputs.python }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      contracts: ${{ steps.filtro.outputs.contracts }}
      docker: ${{ steps.filtro.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            python:
              - 'datos/**'
              - 'db/**'
              - 'backend/**'
              - 'mcp/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            contracts:
              - 'contracts/**'
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/**'
              - 'mcp/**'
              - 'datos/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'

  python:
    name: python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_PASSWORD: ci-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-postgres
      # Base desechable: las pruebas de datos/ borran y recrean el esquema con el superusuario.
      DATABASE_URL_PRUEBAS: postgresql+psycopg://postgres:ci-postgres@localhost:5432/dsa_pruebas
      EMBEDDING_PROVEEDOR: falso
      # steward_datos se importa desde datos/, igual que en las imágenes.
      PYTHONPATH: ${{ github.workspace }}/datos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            datos/requirements.txt
            backend/requirements.txt
            backend/grafo_casos/requirements.txt
            mcp/requirements.txt
      - name: Instalar dependencias
        run: |
          pip install -r datos/requirements.txt -r backend/requirements.txt \
            -r backend/grafo_casos/requirements.txt -r mcp/requirements.txt \
            ruff==0.14.0 mypy
      - name: Roles y base de pruebas (los mismos scripts de db/roles/)
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -f db/roles/01_roles.sql
          psql -v ON_ERROR_STOP=1 -d postgres -c 'CREATE DATABASE dsa_pruebas'
          psql -v ON_ERROR_STOP=1 -d dsa_pruebas -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - name: ruff
        run: |
          ruff check datos backend mcp
          cd db && ruff check .
      - name: mypy (informativo, todavía no bloquea)
        continue-on-error: true
        run: mypy --ignore-missing-imports --explicit-package-bases datos/steward_datos backend mcp/steward_mcp
      - name: Pruebas de datos/
        working-directory: datos
        run: python -m pytest -q
      - name: Pruebas de backend/
        run: |
          python -m unittest discover -s backend/tests -v
          python -m unittest discover -s backend/grafo_casos/tests -v
      - name: Pruebas de mcp/
        run: python -m unittest discover -s mcp/tests -v

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Estos tres pasos se activan solos cuando el frontend agregue los scripts "lint", "typecheck" y "test"
      # a package.json (eslint, tsc --noEmit y vitest run). Mientras no existan, no hacen nada.
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Se activa cuando exista contracts/openapi.json: regenera los tipos de TypeScript y falla si lo que está
      # en el repo no coincide con el contrato.
      - name: Tipos de TypeScript al día con el OpenAPI
        run: |
          if [ ! -f contracts/openapi.json ]; then
            echo "::notice::Todavía no existe contracts/openapi.json; no hay nada que comparar."
            exit 0
          fi
          npx --yes openapi-typescript@7 contracts/openapi.json -o frontend/src/api/tipos.ts
          git diff --exit-code -- frontend/src/api/tipos.ts

  docker-build:
    name: docker-build (${{ matrix.servicio }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [backend, mcp]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.servicio }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Se usa la CLI y no gitleaks-action, que pide licencia en repos de una organización.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD":/repo:ro ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --redact --no-banner

  origen-main:
    name: origen-main
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: A main solo se llega desde dev
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          if [ "$ORIGEN" != "dev" ]; then
            echo "::error::Los PR hacia main solo pueden venir de dev (este viene de '$ORIGEN'). Abre el PR hacia dev."
            exit 1
          fi

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, python, frontend, contracts, docker-build, secrets, origen-main]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado de los jobs
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTADOS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTADOS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::Al menos un job falló o se canceló."
            exit 1
          fi
