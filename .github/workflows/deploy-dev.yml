# Despliegue a dev en cada push a la rama dev (o a mano).
#
#   1. build             construye backend y mcp y los publica en GHCR con los tags <sha> y dev.
#   2. deploy-backend    en el runner self-hosted de la EC2 de dev: /opt/dsa/deploy.sh <sha> dev.
#   3. deploy-frontend   build del frontend con la API de dev y despliegue en Vercel, asignado a dev.<DOMINIO>.
#
# GitHub no tiene credenciales de AWS: el runner vive dentro de la EC2 de dev y usa su perfil de instancia.
# Si el lab está apagado, deploy-backend se queda en cola hasta que el runner vuelva a conectarse.
#
# Seguridad: este workflow usa el runner self-hosted y por eso NUNCA debe dispararse con pull_request.
name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue a la vez; uno nuevo espera a que termine el que está corriendo.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        servicio: [backend, mcp]
    steps:
      - uses: actions/checkout@v4
      - name: Registro en minúsculas (GHCR lo exige)
        run: echo "REGISTRO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.servicio }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRO }}/${{ matrix.servicio }}:${{ github.sha }}
            ${{ env.REGISTRO }}/${{ matrix.servicio }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  deploy-backend:
    name: deploy-backend
    needs: build
    # Interruptor: la variable del repo RUNNER_DEV_ACTIVO=true se pone al registrar el runner. Sin él, el job se
    # quedaría en cola hasta 24 horas esperando un runner que no existe.
    if: vars.RUNNER_DEV_ACTIVO == 'true'
    runs-on: [self-hosted, dsa-dev]
    # El environment registra en GitHub que este SHA se desplegó bien en dev; deploy-prod lo exige antes de promover.
    environment:
      name: dev
      url: https://api-dev.${{ vars.DOMINIO }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Desplegar en la EC2 de dev
        env:
          SHA: ${{ github.sha }}
        # --ref: deploy.sh baja de GitHub los archivos de deploy/ de este mismo commit antes de desplegar.
        run: sudo /opt/dsa/deploy.sh "$SHA" dev --ref "$SHA"

  deploy-frontend:
    name: deploy-frontend
    needs: build
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOMINIO: ${{ vars.DOMINIO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --global vercel@66.2.0
      # Se corre desde la raíz del repo: el proyecto de Vercel tiene Root Directory = frontend.
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build
        env:
          VITE_API_URL: https://api-dev.${{ vars.DOMINIO }}
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy y alias dev.<DOMINIO>
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "Despliegue: $url"
          vercel alias set "$url" "dev.$DOMINIO" --token="$VERCEL_TOKEN"
