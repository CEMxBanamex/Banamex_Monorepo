[project]
name = "steward-datos"
version = "0.1.0"
description = "Frente de Datos del Data Steward Agéntico: esquema, datos sintéticos, políticas, RAG y tools de datos"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["steward_datos", "steward_datos.db", "steward_datos.reglas", "steward_datos.rag", "steward_datos.tools", "steward_datos.api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 190
extend-exclude = ["sinteticos"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E731", "E402"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
