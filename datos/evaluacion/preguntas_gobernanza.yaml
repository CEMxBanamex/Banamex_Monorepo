# Preguntas de prueba del agente de gobernanza (dueño: Mario).
# Uso: scripts/evaluar_gobernanza.py
#   fuentes                       revisa contra la base que cada fuente esperada exista y diga lo que se pide (sin LLM)
#   respuestas --archivo X.jsonl  califica las respuestas del agente
#
# Campos:
#   tools          se acepta cualquiera de ellas (al menos una llamada)
#   fuente         dónde está la respuesta: politica+seccion, glosario (+busqueda), catalogo (+columna) o calidad (+incumplen);
#                  puede ser una lista si la respuesta junta dos fuentes
#   cita           identificadores que la respuesta debe citar; basta uno (todos con cita_todas: true)
#   debe_contener  textos que deben aparecer (sin distinguir mayúsculas ni acentos); también se buscan en la fuente
#   comportamiento sin_fuente (empieza con "No encontré") | fuera_de_dominio ("Esta pregunta no es de gobernanza.")
#   no_debe_regex  patrón que no debe aparecer en la respuesta

preguntas:
  # Políticas
  - id: G-01
    categoria: politica
    pregunta: ¿Quién es el dueño de los datos de proveedores?
    tools: [buscar_politicas, consultar_catalogo]
    fuente: {politica: P-021, seccion: "3"}
    cita: [P-021, "Catálogo: v_proveedores"]
    debe_contener: [Dirección de Compras]
  - id: G-02
    categoria: politica
    pregunta: ¿El RFC es dato sensible?
    tools: [buscar_politicas]
    fuente: {politica: P-020, seccion: "3"}
    cita: [P-020]
    debe_contener: [persona física, persona moral]
  - id: G-03
    categoria: politica
    pregunta: ¿Qué niveles de clasificación de la información existen?
    tools: [buscar_politicas]
    fuente: {politica: P-020, seccion: "2"}
    cita: [P-020]
    debe_contener: [público, interno, confidencial, restringido]
  - id: G-04
    categoria: politica
    pregunta: ¿Qué hace el data steward cuando una regla de calidad no alcanza su umbral?
    tools: [buscar_politicas]
    fuente: {politica: P-022, seccion: "5"}
    cita: [P-022]
    debe_contener: [incidente]
  - id: G-05
    categoria: politica
    pregunta: ¿Qué umbral de calidad se exige al correo de los clientes?
    tools: [buscar_politicas, consultar_calidad]
    fuente: {politica: P-022, seccion: "3"}
    cita: [P-022, RC-007, RC-008]
    debe_contener: ["99%", "99.5%"]
  - id: G-06
    categoria: politica
    pregunta: ¿Puedo consultar la bitácora o las tablas internas desde el chat?
    tools: [buscar_politicas]
    fuente: {politica: P-023, seccion: "2"}
    cita: [P-023]
    debe_contener: [vistas consultables]
  - id: G-07
    categoria: politica
    pregunta: ¿Por qué veo el RFC del cliente con asteriscos?
    tools: [buscar_politicas, consultar_catalogo]
    fuente: {politica: P-023, seccion: "4"}
